---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: webappdeployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
        - name: nginxcontainer
          image: nginx:1.28.0
          ports:
            - containerPort: 80
