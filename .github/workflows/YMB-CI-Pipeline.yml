# This pipeline supports Ben Secure's audit requirement by recording
# automated test results linked to version-controlled YMB code changes.
# These records support OSFI audit evidence for controlled changes;
# required status checks must enforce the merge gate.
name: YMB Banking App CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest test_main.py -v